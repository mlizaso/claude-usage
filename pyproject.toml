# Packaging metadata so the tool can be installed with `uv tool install` / `pipx`
# without a clone (#144). This is packaging only — the tool stays stdlib-only at
# runtime ([project.dependencies] is empty) and the clone + `python cli.py` path
# is unaffected.
#
# The version is read dynamically from claude_usage.scanner.VERSION so it stays a single
# source of truth (kept in lockstep with the CHANGELOG heading and the VS Code
# extension's package.json by tests/test_version.py) — do NOT hardcode it here.
[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-usage"
dynamic = ["version"]
description = "Codex / Claude Usage: local token, cost, and session dashboard"
readme = "docs/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "vendor/LICENSE.chartjs.md"]
authors = [{ name = "Paweł Huryn" }]
keywords = ["claude", "claude-code", "codex", "openai", "usage", "tokens", "cost", "dashboard"]
dependencies = []

[project.urls]
Homepage = "https://github.com/mlizaso/claude-usage"
Issues = "https://github.com/mlizaso/claude-usage/issues"

[project.scripts]
claude-usage = "claude_usage.cli:main"

# Runtime implementations live under one qualified package.  The historical
# root module names are source-checkout aliases only and are deliberately not
# installed, so a shared Python environment cannot collide on generic names
# such as ``db`` or ``scanner``.
[tool.setuptools]
packages = ["claude_usage"]

[tool.setuptools.data-files]
"share/claude-usage/vendor" = [
    "vendor/chart.umd.js",
    "vendor/LICENSE.chartjs.md",
]
# The dashboard document is assembled from these at runtime (see
# claude_usage.dashboard.load_html_template); without them the server cannot
# render a page.
"share/claude-usage/web" = [
    "web/index.html",
    "web/app.css",
    # Served by GET /icon.svg and masked into the header by app.css. It lives
    # here rather than only in vscode-extension/resources/ because this install,
    # Homebrew's and the Docker image ship no vscode-extension/ at all — the
    # route 404'd on all three while the page around it rendered fine.
    "web/icon.svg",
]
# The application JS is split into ordered parts; the numeric prefixes decide
# load order, so all of them must ship.
"share/claude-usage/web/js" = [
    "web/js/00-core.js",
    "web/js/10-pricing.js",
    "web/js/20-format.js",
    "web/js/30-ranges.js",
    "web/js/40-filters.js",
    "web/js/50-render.js",
    "web/js/52-charts.js",
    "web/js/54-tables.js",
    "web/js/56-plan.js",
    "web/js/58-alerts.js",
    "web/js/60-export.js",
    "web/js/70-bootstrap.js",
]
"share/claude-usage/web/limits" = [
    "web/limits/index.html",
    "web/limits/app.css",
    "web/limits/app.js",
]

[tool.setuptools.dynamic]
version = { attr = "claude_usage.scanner.VERSION" }
