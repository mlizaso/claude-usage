name: Tag and release from CHANGELOG

# Runs after each push to main, and on demand from the Actions tab. If
# docs/CHANGELOG.md gained a DATED `## vX.Y.Z` heading anywhere in the push's commit
# range (compared to the push's `before` SHA), then in this order:
#   1. require Tests for this exact commit AND the newest applicable VS Code
#      extension run to have succeeded (a path-filtered release push inherits
#      the run covering the most recent extension-affecting commit),
#   2. build and audit the .vsix under a read-only token, then
#   3. hand only the .vsix + notes to a contents:write job, which creates a
#      lightweight tag and publishes a GitHub Release.
#
# CHANGELOG is the source of truth; the tag and the Release are deterministic
# projections of it, with the built .vsix as a release asset.
#
# THE DATE IS THE GO SIGNAL. `## v1.7.0 — TBD` is explicitly not releasable, so
# a heading can sit on main collecting bullets exactly the way it used to sit on
# the DEV branch, and filling in the date is what ships it. Before this, any
# pushed heading released immediately — safe only because DEV stood between the
# two; with a main-only flow it would have published notes reading "TBD".
#
# No action when CHANGELOG wasn't touched, when the newest heading has no date,
# when the heading merely rewrites an already-tagged version, or when the tag
# already points at this commit. If the tag exists but points ELSEWHERE the run
# fails on purpose rather than moving it — so an amend or force-push after
# tagging is a deliberate stop, not a silent no-op.
#
# A failed release is retried with workflow_dispatch rather than by inventing a
# new heading: a same-commit re-push cannot re-add one, which is exactly how
# v1.6.0 ended up needing a manual `gh release create`. The hatch releases only
# the newest dated heading, only from main.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re-)release, e.g. v1.6.1. Blank = the newest dated heading in docs/CHANGELOG.md."
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to read the Tests workflow's conclusion for this commit.
      actions: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      # The commit the tag lands on. Equal to github.sha on a push; on a manual
      # re-run it is the commit that DATED the heading, which is what the
      # CHANGELOG section actually describes.
      release_sha: ${{ steps.detect.outputs.release_sha }}
      vsix_filename: ${{ steps.build.outputs.vsix_filename }}

    steps:
      # workflow_dispatch cannot be branch-restricted in `on:`, and the Actions
      # "Run workflow" dropdown offers every branch and tag. Without this, a
      # release-prep branch carrying a dated heading and a matching package.json
      # could be dispatched to tag and publish an UNMERGED commit — and would
      # then burn that version, since the real merge to main would hit the
      # "tag already points elsewhere" guard and could never release.
      - name: Release from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::This workflow releases from main only; it was dispatched on $REF."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need enough history to diff the whole push range (`before..after`)
          # not just the tip commit. fetch-depth: 0 = full clone; small repo,
          # cheap. Avoids edge cases where a multi-commit push lands a version
          # heading in a non-tip commit.
          fetch-depth: 0
          # Do not leave even the read token in git configuration while the
          # extension build executes repository-controlled package scripts.
          persist-credentials: false

      - name: Detect new version heading in CHANGELOG
        id: detect
        env:
          EVENT:  ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER:  ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # A heading is releasable only once it carries a real date, and the
          # date must be the whole of the field after the separator — not merely
          # present somewhere on the line, or `## v1.7.0 — TBD (was 2026-08-01)`
          # would release. Shape: `## vX.Y.Z <sep> YYYY-MM-DD` and nothing after.
          # The `[[:space:]]` after the triplet also keeps `## v1.1.0a` from
          # matching `v1.1.0`.
          DATED='## v[0-9]+\.[0-9]+\.[0-9]+[[:space:]]+[^[:space:]]+[[:space:]]+[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*$'
          ANY_HEADING='## v[0-9]+\.[0-9]+\.[0-9]+([[:space:]]|$)'
          # Diagnostics only, never a trigger. "Shows a date somewhere" is a
          # different question from DATED, and it is the one that separates a
          # heading nobody dated from one dated in a shape DATED will not act
          # on. Both are undated as far as the release is concerned, and telling
          # a maintainer which of the two they wrote is the whole of its job:
          # the messages below used to answer "replace TBD with the date" to a
          # heading that already carried one.
          DATE_ANYWHERE='[0-9]{4}-[0-9]{2}-[0-9]{2}'

          # ── Manual re-run ────────────────────────────────────────────────
          # There is no diff to inspect, so read the CHANGELOG itself. This is
          # the escape hatch for a release that failed after its heading had
          # already landed: pushing the same commit again cannot re-add the
          # heading, so without this the only route is a hand-rolled
          # `gh release create`.
          #
          # Only the TOP heading is dispatchable, and only once dated. That is
          # not a restriction so much as the only coherent choice: scanner.VERSION
          # and vscode-extension/package.json are pinned to the top heading by
          # tests/test_version.py, and the build step below refuses to package a
          # .vsix whose version disagrees — so any older heading would abort
          # there anyway, and an undated one would publish notes reading "TBD",
          # which is the whole thing the date requirement exists to stop.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            top=$(grep -m1 -E "^$ANY_HEADING" docs/CHANGELOG.md || true)
            if [ -z "$top" ]; then
              echo "::error::No '## vX.Y.Z' heading found in docs/CHANGELOG.md."
              exit 1
            fi
            version=$(printf '%s' "$top" | sed -E 's/^## (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            if ! printf '%s\n' "$top" | grep -qE "^$DATED"; then
              if printf '%s\n' "$top" | grep -qE "$DATE_ANYWHERE"; then
                echo "::error::The newest heading is '$top' — it shows a date, but not where the release trigger looks for it: the date must be the whole of the field after the separator ('## vX.Y.Z — YYYY-MM-DD' and nothing after it). Drop the trailing text first."
              else
                echo "::error::The newest heading is '$top' — it carries no release date, so there is nothing to release. Replace TBD with the date first."
              fi
              exit 1
            fi
            if [ -n "${INPUT_VERSION:-}" ]; then
              # grep is line-oriented, so a multi-line input would pass a
              # `^v[0-9]...$` check on one of its lines and then be written
              # unescaped into $GITHUB_OUTPUT as a second `version=` assignment.
              if [ "$(printf '%s' "$INPUT_VERSION" | wc -l)" -ne 0 ]; then
                echo "::error::The version input must be a single line."
                exit 1
              fi
              want="$INPUT_VERSION"
              case "$want" in v*) ;; *) want="v$want" ;; esac
              if ! printf '%s' "$want" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::'$INPUT_VERSION' is not a vX.Y.Z version."
                exit 1
              fi
              if [ "$want" != "$version" ]; then
                echo "::error::Only the newest CHANGELOG heading ($version) can be released; you asked for $want. Releasing an older version would package a .vsix whose version disagrees with it."
                exit 1
              fi
            fi

            # Release the commit that DATED the heading, not whatever HEAD has
            # become. A retry days later would otherwise sweep the commits
            # pushed in between into this version — commits its own release
            # notes do not describe, and which would then also appear in the
            # next release. The tag stops being a projection of the CHANGELOG,
            # which is the property this whole workflow rests on.
            release_sha="$AFTER"
            origin_sha=$(git log -S"$top" --format=%H -- docs/CHANGELOG.md | tail -1 || true)
            if [ -n "$origin_sha" ] && [ "$origin_sha" != "$AFTER" ]; then
              if git merge-base --is-ancestor "$origin_sha" "$AFTER" 2>/dev/null; then
                release_sha="$origin_sha"
                behind=$(git rev-list --count "$origin_sha..$AFTER")
                echo "$version was dated in $origin_sha; releasing that commit rather than HEAD ($AFTER), which is $behind commit(s) ahead."
              else
                echo "::error::$version was dated in $origin_sha, which is not an ancestor of $AFTER. Refusing to tag a divergent commit."
                exit 1
              fi
            fi

            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: releasing $version at $release_sha"
            exit 0
          fi

          # ── Push ─────────────────────────────────────────────────────────
          # On a brand-new branch (first push), before is all zeros.
          zeros="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$zeros" ] || [ -z "$BEFORE" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Brand-new branch push; nothing to compare."
            exit 0
          fi

          # Dated headings ADDED anywhere in the pushed range. Replacing TBD
          # with a date rewrites the line, so it shows up here as an addition —
          # which is exactly the intended trigger.
          added_versions=$(git diff "$BEFORE..$AFTER" -- docs/CHANGELOG.md \
            | grep -E "^\+$DATED" \
            | sed -E 's/^\+## (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/' \
            || true)

          # Drop anything already tagged. Detection keys on "a dated heading
          # appeared as a + in the diff", which is also true when an existing,
          # released heading is merely rewritten — fixing a typo in the title,
          # correcting a date, normalising the dash. Without this, such a
          # docs-only push turns red (either the package.json check or the
          # "tag already points elsewhere" guard aborts), and it can also trip
          # the multiple-headings guard below and block a genuine release
          # riding in the same push.
          if [ -n "$added_versions" ]; then
            kept=""
            # Deliberate word splitting: a version is vX.Y.Z, never has spaces.
            # shellcheck disable=SC2086
            for v in $added_versions; do
              if git rev-parse -q --verify "refs/tags/$v" >/dev/null 2>&1; then
                echo "$v is already tagged; treating the rewritten heading as a docs edit."
              else
                kept="${kept}${kept:+ }$v"
              fi
            done
            # shellcheck disable=SC2086
            added_versions=$(for v in $kept; do echo "$v"; done)
          fi

          if [ -z "$added_versions" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            # Distinguish "nothing to do" from "you forgot the date", because
            # the second one looks identical from the Actions tab and is the
            # mistake this workflow is now designed to absorb.
            undated=$(git diff "$BEFORE..$AFTER" -- docs/CHANGELOG.md \
              | grep -E "^\+$ANY_HEADING" || true)
            if [ -n "$undated" ]; then
              echo "A version heading was added but carries no release date, so nothing was tagged:"
              printf '%s\n' "$undated" | sed 's/^+/  /'
              if printf '%s\n' "$undated" | grep -qE "$DATE_ANYWHERE"; then
                echo "A date is shown above, so the shape is what stopped it: the date must be the whole of the field after the separator (## vX.Y.Z — YYYY-MM-DD and nothing after it). Drop the trailing text and push — the corrected line is an addition in that push's diff, so the trigger fires on it."
              else
                echo "Replace TBD with the release date (## vX.Y.Z — YYYY-MM-DD) and push to ship it."
              fi
            else
              echo "No new dated ## vX.Y.Z heading added to CHANGELOG; nothing to tag."
            fi
            exit 0
          fi

          # If multiple new headings were added in one push, fail loudly —
          # ambiguous which one to tag and shipping two releases in one merge
          # is almost certainly not intended.
          count=$(echo "$added_versions" | wc -l)
          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple new version headings detected; refusing to auto-tag. Versions: $added_versions"
            exit 1
          fi

          version=$(echo "$added_versions" | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # On a push the heading arrived inside this range, so the tip is the
          # commit that describes it.
          echo "release_sha=$AFTER" >> "$GITHUB_OUTPUT"
          echo "Detected new release: $version at $AFTER"

      # The tag and the Release are published by a job holding contents:write,
      # so a red commit reaching that point is worse than a red commit on main.
      # Tests and this workflow both fire on the same push and run concurrently,
      # so without this gate the release could (and did) overtake them.
      # The .vsix, the release notes and the tag must all come from the same
      # commit, or the asset does not match what the tag says it is.
      - name: Check out the commit being released
        if: steps.detect.outputs.version != '' && steps.detect.outputs.release_sha != github.sha
        env:
          RELEASE_SHA: ${{ steps.detect.outputs.release_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Building and tagging $RELEASE_SHA rather than $HEAD_SHA."
          git checkout --detach "$RELEASE_SHA"

      - name: Require the test suites to have passed for this commit
        if: steps.detect.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.detect.outputs.release_sha }}
        run: |
          set -euo pipefail

          # Selected by workflow FILE, event and branch — not by display name.
          # `.name` is a label: a pull_request run (whose head_sha is the branch
          # commit, not a merge commit) would satisfy a name-only match, and so
          # would any future workflow someone happens to call "Tests".
          runs_for() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
              --jq "[.workflow_runs[]
                     | select(.path == \"$1\" and .event == \"push\" and .head_branch == \"main\")]
                    | sort_by(.run_started_at) | last // empty"
          }

          # A CHANGELOG-only release does not trigger the path-filtered
          # extension workflow. In that case, inherit the newest push run whose
          # head is both in this release's history and at or after the latest
          # extension-affecting commit. This also handles a multi-commit push:
          # Actions records the push tip, not necessarily the commit that
          # changed the extension. Absence is never a pass; a missing run waits
          # and eventually fails closed.
          extension_run_for() {
            local exact relevant candidates run_sha status outcome
            if ! exact=$(runs_for ".github/workflows/extension-ci.yml"); then
              return 1
            fi
            if [ -n "$exact" ]; then
              printf '%s' "$exact"
              return
            fi

            # Historical retries must include the package's previous path,
            # or they could inherit CI from before a runtime-only change.
            relevant=$(git log -1 --format=%H "$SHA" -- \
              vscode-extension docs/VS-CODE-EXTENSION.md \
              ':(top,glob)*.py' codex_claude_usage claude_usage web vendor \
              .github/workflows/extension-ci.yml)
            [ -n "$relevant" ] || return

            if ! candidates=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/extension-ci.yml/runs?branch=main&event=push&per_page=100" \
              --paginate --slurp \
              --jq '[.[].workflow_runs[]] | sort_by(.run_started_at) | reverse | .[]
                    | [.head_sha, .status, (.conclusion // "pending")] | @tsv'); then
              return 1
            fi

            while IFS=$'\t' read -r run_sha status outcome; do
              [ -n "$run_sha" ] || continue
              if git merge-base --is-ancestor "$run_sha" "$SHA" \
                && git merge-base --is-ancestor "$relevant" "$run_sha"; then
                jq -n --arg status "$status" --arg outcome "$outcome" \
                  '{status: $status, conclusion: $outcome}'
                return
              fi
            done <<< "$candidates"
          }

          check() {  # $1 = workflow path, $2 = exact|extension -> ok|wait|fail:<why>
            local latest status outcome
            if [ "$2" = extension ]; then
              latest=$(extension_run_for 2>/tmp/gh_err) || {
                echo "api-error"; return
              }
            elif ! latest=$(runs_for "$1" 2>/tmp/gh_err); then
              echo "api-error"; return
            fi
            if [ -z "$latest" ]; then
              echo "wait"
              return
            fi
            status=$(printf '%s' "$latest"  | jq -r '.status')
            outcome=$(printf '%s' "$latest" | jq -r '.conclusion // "pending"')
            [ "$status" = "completed" ] || { echo "wait"; return; }
            [ "$outcome" = "success" ] && echo "ok" || echo "fail:$outcome"
          }

          deadline=$(( $(date +%s) + 900 ))
          api_failures=0
          attempts=0
          while :; do
            attempts=$(( attempts + 1 ))
            py=$(check ".github/workflows/tests.yml" exact)
            ext=$(check ".github/workflows/extension-ci.yml" extension)

            case "$py:$ext" in
              api-error*|*:api-error)
                # Never treated as a pass. Counted so the timeout below can say
                # whether the tests were slow or the query itself never worked —
                # a missing actions:read permission otherwise looks identical to
                # a hanging test suite.
                api_failures=$(( api_failures + 1 ))
                ;;
              ok:ok)
                echo "Tests and the applicable VS Code extension run are green for $SHA."
                break
                ;;
              fail:*|*:fail:*)
                [ "${py#fail:}" != "$py" ] && echo "::error::Tests concluded '${py#fail:}' for $SHA; refusing to tag or publish."
                [ "${ext#fail:}" != "$ext" ] && echo "::error::VS Code extension tests concluded '${ext#fail:}' for $SHA; refusing to publish a .vsix its own suite rejected."
                exit 1
                ;;
            esac

            if [ "$(date +%s)" -ge "$deadline" ]; then
              if [ "$api_failures" -eq "$attempts" ]; then
                echo "::error::Could not query workflow runs for $SHA — every attempt failed. Check the prepare job's actions:read permission."
                cat /tmp/gh_err 2>/dev/null || true
              else
                echo "::error::Timed out waiting for the test suites to finish for $SHA (Tests=$py, extension=$ext)."
              fi
              exit 1
            fi
            sleep 15
          done

      # Build under a read-only token. The separate release job is the only job
      # granted contents:write, so repository-controlled package scripts can
      # never access a write-capable GITHUB_TOKEN.
      # Everything below is gated on a new version being detected, so ordinary
      # pushes to main (docs, typo fixes) incur no Node setup or build cost.

      - name: Set up Node (to build the .vsix)
        if: steps.detect.outputs.version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build the .vsix
        id: build
        if: steps.detect.outputs.version != ''
        working-directory: vscode-extension
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail

          # The .vsix filename embeds vscode-extension/package.json's version, so
          # it must match the CHANGELOG heading or the asset name won't match the
          # tag. Bumping package.json is a release-time step (see AGENTS.md); fail
          # loudly if it was forgotten rather than ship a mislabelled asset.
          want="${VERSION#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "$want" ]; then
            echo "::error::vscode-extension/package.json is $pkg_version but CHANGELOG released $VERSION. Bump package.json to $want before the release merge."
            exit 1
          fi

          npm ci --ignore-scripts --omit=optional --no-audit --no-fund
          npm audit signatures
          npm audit --ignore-scripts --audit-level=low
          npm run package

          name=$(node -p "require('./package.json').name")
          case "$name" in
            codex-claude-usage|claude-usage|claude-usage-private) ;;
            *) echo "::error::Unexpected extension package identity."; exit 1 ;;
          esac
          vsix="${name}-${want}.vsix"
          if [ -L "$vsix" ] || [ ! -f "$vsix" ]; then
            echo "::error::Expected $vsix but it wasn't produced."
            exit 1
          fi
          echo "VSIX=vscode-extension/$vsix" >> "$GITHUB_ENV"
          echo "vsix_filename=$vsix" >> "$GITHUB_OUTPUT"
          echo "Built $vsix."

      - name: Prepare release notes
        if: steps.detect.outputs.version != ''
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-output
          # Keep the manifest-derived filename when retrying a historical
          # build; a new filename must not disguise an old extension identity.
          cp "$VSIX" release-output/
          awk -v ver="$VERSION" '
            /^## v[0-9]/ { if (started) exit; if ($2 == ver) started=1 }
            started { print }
          ' docs/CHANGELOG.md > release-output/notes.md
          if [ ! -s release-output/notes.md ]; then
            echo "::error::No '## $VERSION' section found in docs/CHANGELOG.md."
            exit 1
          fi

      - name: Upload reviewed release payload
        if: steps.detect.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-claude-usage-release-${{ github.sha }}
          path: release-output/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download reviewed release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-claude-usage-release-${{ github.sha }}
          path: release-output

      - name: Create matching tag and GitHub release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          VSIX_FILENAME: ${{ needs.prepare.outputs.vsix_filename }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid reviewed release version."
            exit 1
          fi
          want="${VERSION#v}"
          case "$VSIX_FILENAME" in
            "codex-claude-usage-${want}.vsix"|"claude-usage-${want}.vsix"|"claude-usage-private-${want}.vsix") ;;
            *) echo "::error::Invalid reviewed VSIX filename."; exit 1 ;;
          esac
          vsix="release-output/$VSIX_FILENAME"
          if [ -L "$vsix" ] || [ -L release-output/notes.md ] \
            || [ ! -f "$vsix" ] || [ ! -s release-output/notes.md ]; then
            echo "::error::The reviewed release payload is incomplete."
            exit 1
          fi

          # Only read the SHA when the lookup actually succeeded. `gh api` prints
          # its error BODY to stdout on a 404 and `2>/dev/null` only silences
          # stderr, so the old one-liner captured that JSON as `existing_tag` —
          # non-empty, never equal to the release commit — and the guard below aborted
          # with `Tag v1.6.0 already points to {"message":"Not Found"...}` on
          # exactly the case it was meant to allow: a tag that does not exist yet.
          existing_tag=""
          if tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" 2>/dev/null); then
            existing_tag=$(printf '%s' "$tag_ref" | jq -r '.object.sha // empty')
          fi
          if [ -n "$existing_tag" ] && [ "$existing_tag" != "$RELEASE_SHA" ]; then
            echo "::error::Tag $VERSION already points to $existing_tag, not $RELEASE_SHA."
            exit 1
          fi
          if [ -z "$existing_tag" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$VERSION" \
              -f sha="$RELEASE_SHA" >/dev/null
            echo "Tagged $VERSION at $RELEASE_SHA."
          fi

          # Idempotent: a re-run against the same tag does not replace assets.
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            exit 0
          fi

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file release-output/notes.md \
            "$vsix"
          echo "Released $VERSION with $vsix attached."
