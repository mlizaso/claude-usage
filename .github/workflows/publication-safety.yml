name: Publication safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install verified secret scanner
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gitleaks"
          mkdir -p "$directory"
          archive="$directory/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$directory" gitleaks
          echo "$directory" >> "$GITHUB_PATH"

      - name: Check public history and secrets
        run: python scripts/check-publication.py

      - name: Check publication fixtures and image metadata
        run: python -m unittest tests.test_publication_hygiene -v
