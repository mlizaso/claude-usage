name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Windows and macOS are in the matrix because Windows support was true only
    # BY CONSTRUCTION — every path goes through Path.home(), and the four
    # platform-specific branches are os.name guards that no-op there — but was
    # never actually executed on Windows. This repo has twice shipped something
    # that was correct in principle and broken in fact, so the claim gets a run.
    #
    # It answered: on the first two runs macOS passed and Windows failed, in the
    # test harness rather than in product code — every text read and every
    # subprocess(text=True) under tests/ needs an explicit encoding= or Windows
    # decodes it with the cp1252 codepage. See AGENTS.md. Do NOT paper over that
    # with PYTHONUTF8 here: it would green the runner in one line while leaving
    # every Windows user running the suite exactly as broken.
    #
    # Standard hosted runners are free for this public repository. Linux covers
    # the supported Python versions; macOS and Windows cover platform behavior.
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others pass.
      fail-fast: false
      # Every platform installs the same headless browser and enforces its tests.
      matrix:
        include:
          - { os: ubuntu-latest,  python-version: "3.11", require-browser: "1" }
          - { os: ubuntu-latest,  python-version: "3.12", require-browser: "1" }
          - { os: ubuntu-latest,  python-version: "3.13", require-browser: "1" }
          - { os: macos-latest,   python-version: "3.13", require-browser: "1" }
          - { os: windows-latest, python-version: "3.13", require-browser: "1" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Install the test browser
        shell: bash
        run: |
          npx --yes @puppeteer/browsers@3.2.3 install chrome-headless-shell@154.0.8037.92 --path "$RUNNER_TEMP/browser"
          python - <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "browser"
          binaries = [p for p in directory.rglob("*")
                      if p.name in {"chrome-headless-shell", "chrome-headless-shell.exe"}
                      and p.is_file()]
          assert len(binaries) == 1, binaries
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("CODEX_CLAUDE_USAGE_CHROME=" + str(binaries[0].resolve()) + "\n")
          PY

      - name: Run tests
        # ubuntu-latest ships node, so tests/test_dashboard_js.py really does
        # execute the dashboard's embedded JavaScript here. That suite skips
        # itself when no JS engine is on PATH, which would let a runner image
        # that dropped node report green while testing none of the JS — this
        # flag turns that silent skip into a loud failure.
        #
        # CODEX_CLAUDE_USAGE_REQUIRE_BROWSER is the same contract for the only tests
        # that see pixels. Everything else runs under node against a DOM stub
        # with no fonts, no boxes and no scrollbars, which is how a table
        # rendering 146px outside its own column, a page-wide horizontal
        # scrollbar and a pan track that could not reach the newest day all
        # passed the suite. Only TestDailyPanelGeometryInABrowser can see that
        # class of defect, and it has TWO silent-skip paths — no browser found,
        # and a browser that produces no measurement — either of which leaves a
        # green run that measured nothing. The flag turns both into failures.
        #
        # The pinned headless shell avoids desktop-browser startup stalls and
        # gives Windows the same rendered-geometry coverage as Linux and macOS.
        env:
          CODEX_CLAUDE_USAGE_REQUIRE_JS: "1"
          CODEX_CLAUDE_USAGE_REQUIRE_BROWSER: ${{ matrix.require-browser }}
        # -t . is load-bearing, not tidiness: without it discovery sets
        # top_level_dir to `tests` and imports every module under its BARE
        # name, so `tests/__init__.py` -- which installs the guard that stops a
        # test writing to the developer's real ~/.claude -- never runs. It
        # survived only because 21 of the 58 modules happen to do
        # `from tests.X import ...`. tests/test_real_data_guard_is_live.py
        # fails the run if it is ever absent again.
        run: python -m unittest discover -s tests -t . -v
