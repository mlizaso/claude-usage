name: Bug report
description: Report a problem using synthetic, non-sensitive examples.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Never attach transcripts, databases, account files or authenticated dashboard URLs."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, application version and install method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps and an invented example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, personal paths, private project names and real usage data.
          required: true
